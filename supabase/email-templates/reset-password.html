<!--
  Supabase → Authentication → Emails → Templates → "Reset password"
  Subject: كلمة مرور جديدة لحسابك في جُملة
  Paste everything below this comment into "Message body".
-->
<div dir="rtl" style="font-family: Tahoma, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2933;">
  <h2 style="margin: 0 0 12px;">تعيين كلمة مرور جديدة</h2>
  <p style="line-height: 1.9; margin: 0;">طلبت تغيير كلمة المرور. اضغط الزر تحت واختر كلمة مرور جديدة. تقدّمك محفوظ ولن يتأثر.</p>
  <p style="margin: 28px 0;">
    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="background: #14b8a6; color: #042f2e; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold;">
      اختر كلمة مرور جديدة
    </a>
  </p>
  <p style="line-height: 1.8; color: #6b7280; font-size: 13px; margin: 0;">إذا ما طلبت هذا، تجاهل الرسالة وكلمة مرورك الحالية تبقى كما هي.</p>
</div>

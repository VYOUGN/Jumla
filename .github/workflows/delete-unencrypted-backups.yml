# Run once, by hand, before making the repository public (README section 5).
# Permanently deletes the backups saved before encryption was added (artifacts named
# jumla-backup-<number>). Encrypted backups (jumla-backup-encrypted-<number>) are kept,
# and nothing is deleted until at least one encrypted backup exists.
name: Delete old unencrypted backups

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to permanently delete the old unencrypted backups"
        required: true

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete unencrypted backup artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "::error::Nothing deleted. Type DELETE (capital letters) in the box to confirm."
            exit 1
          fi
          # One line per artifact: id, name, expired.
          list=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .expired] | @tsv')
          kept=$(printf '%s\n' "$list" | awk -F'\t' '$2 ~ /^jumla-backup-encrypted-[0-9]+$/ && $3 == "false"' | wc -l)
          if [ "$kept" -lt 1 ]; then
            echo "::error::Nothing deleted: there is no encrypted backup yet. Run \"Daily database backup\" once, then try again."
            exit 1
          fi
          # Expired artifacts have no files left, so only live ones need deleting.
          old=$(printf '%s\n' "$list" | awk -F'\t' '$2 ~ /^jumla-backup-[0-9]+$/ && $3 == "false" {print $1}')
          deleted=0
          for id in $old; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            deleted=$((deleted + 1))
          done
          echo "Deleted $deleted unencrypted backup(s). Kept $kept encrypted backup(s)."
          echo "### Deleted $deleted unencrypted backup(s), kept $kept encrypted" >> "$GITHUB_STEP_SUMMARY"
